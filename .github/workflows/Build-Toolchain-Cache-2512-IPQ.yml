name: Build Toolchain Cache (IPQ 25.12)

permissions:
  contents: write
  actions: write

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      config_repo:
        description: 'Build and upload options'
        required: true
        default: '{"Cache":"1","CacheSave":"false","CacheSaveOnFailure":"true","UPLOAD_RELEASE":"1","ALLKMOD":"1"}'
      MACH:
        description: 'Choose machine'
        required: true
        default: 'aliyun_ap8220'
        type: choice
        options:
        - 'link_nn6000-v2-lite'
        - 'link_nn6000-v2'
        - 'link_nn6000-v2-12m'
        - 'link_nn6000-v2-12m-lite'
        - 'aliyun_ap8220'
        - 'aliyun_ap8220-12m'
        - 'jdcloud_re-ss-01'
        - 'jdcloud_re-ss-01-12m'
      SFE_BUILDIN:
        description: 'Build SFE acceleration'
        default: 'true'
        type: choice
        options:
        - 'true'
        - 'false'
      patch_repo:
        description: 'IPQ 25.12 branch and feature options'
        required: true
        default: '{"Branch":"25.12-nss-6.6-dev","IPQ_Firmware":"ipq-nss-12-5","BCM_FULLCONE":"1","TRY_BBR_V3":"1","KERNEL66":"1","Firewall_Allow_WAN":"0","ADD_IB":"1","ADD_SDK":"1","ADD_eBPF":"0","ADD_SKB_RECYCLER":"1","DOCKER_BUILDIN":"0"}'
      SETIP:
        description: 'Set LAN IP address'
        default: '192.168.17.1'
        required: false
      packages:
        description: 'Additional packages'
        required: true
        default: 'luci-app-mwan-switch'
      packages_mod:
        description: 'Additional package mode'
        default: 'm'
        type: choice
        options:
        - 'y'
        - 'm'
        - 'n'

env:
  TZ: Asia/Shanghai
  OpenWrt_PATCH_FILE_DIR: openwrt-2512-ipq
  OpenWrt_REPO_ENV_FILE: openwrt-2512-ipq

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      machine: ${{ steps.set-matrix.outputs.machine }}
    env:
      Target_CFG_Machine: ${{ github.event.inputs.MACH || github.event.client_payload.MACH }}
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: Resolve build matrix
        id: set-matrix
        run: bash "$GITHUB_WORKSPACE/core-2512-ipq.sh" resolve-build-matrix

  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    needs: prepare
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: Toolchain ${{ needs.prepare.outputs.machine }} ${{ matrix.target }} OpenWrt 25.12 IPQ
    env:
      Matrix_Target: ${{ matrix.target }}
      Target_CFG_Machine: ${{ needs.prepare.outputs.machine }}
      SFE_INPUT_STATUS: ${{ github.event.inputs.SFE_BUILDIN || github.event.client_payload.SFE_BUILDIN || 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: check server conf
        run: |
          echo -e "------------------------------- CPU信息 -------------------------------\n"
          echo "CPU物理数量:$(cat /proc/cpuinfo| grep "physical id"| sort| uniq| wc -l)"
          echo -e "CPU核心及版本信息: $(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
          echo -e "------------------------------- 内存信息 -------------------------------\n"
          echo "已安装内存详细信息: "
          sudo lshw -short -C memory | grep GiB
          echo -e "\n"
          echo -e "------------------------------- 磁盘信息 -------------------------------\n"
          echo -e "磁盘数量: $(ls /dev/sd* | grep -v [1-9] | wc -l) \n"
          echo "------------------------------- 磁盘详情 -------------------------------\n"
          df -Th

      - name: free up disk space
        uses: endersonmenezes/free-disk-space@v2
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/share/glade* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell"
          testing: false

      - name: 检查空间使用情况
        if: (!cancelled())
        run: df -hT

      - name: Initialize build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          chmod +x core-2512-ipq.sh gen-sha256sum.sh after_build.sh archive/diy-openwrt-2512-ipq.sh
          "$GITHUB_WORKSPACE/core-2512-ipq.sh" init-pkg-env

      - name: Export build options
        env:
          PATCH_JSON_INPUT: '${{ github.event.inputs.patch_repo || github.event.client_payload.patch_repo }}'
          CONFIG_JSON_INPUT: '${{ github.event.inputs.config_repo || github.event.client_payload.config_repo }}'
        run: |
          "$GITHUB_WORKSPACE/core-2512-ipq.sh" init-gh-env

      - name: Clone OpenWrt source
        working-directory: /workdir
        id: clone
        env:
          OPENWRT_REPO_SSH_KEY: ${{ secrets.OPENWRT_REPO_SSH_KEY }}
        run: |
          if [ -z "$OPENWRT_REPO_SSH_KEY" ]; then
            echo "::error::secret OPENWRT_REPO_SSH_KEY 未设置（私有仓库只读 Deploy Key 私钥）"
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$OPENWRT_REPO_SSH_KEY" > ~/.ssh/openwrt_repo_key
          chmod 600 ~/.ssh/openwrt_repo_key
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/openwrt_repo_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new"
          git clone --single-branch --branch "$REPO_BRANCH" "$REPO_URL" openwrt
          ln -sf /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"
          cd openwrt
          sed -i \
            -e 's|https://git.openwrt.org/feed/packages.git;openwrt-25.12|https://github.com/openwrt/packages.git;openwrt-25.12|' \
            -e 's|https://git.openwrt.org/project/luci.git;openwrt-25.12|https://github.com/openwrt/luci.git;openwrt-25.12|' \
            -e 's|https://git.openwrt.org/feed/routing.git;openwrt-25.12|https://github.com/openwrt/routing.git;openwrt-25.12|' \
            -e 's|https://git.openwrt.org/feed/telephony.git;openwrt-25.12|https://github.com/openwrt/telephony.git;openwrt-25.12|' \
            feeds.conf.default
          grep -q 'src-git lunatic7' feeds.conf.default || \
            sed -i '$a src-git lunatic7 https://github.com/lunatickochiya/luna-action-packages.git' feeds.conf.default
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Link build cache
        run: |
          "$GITHUB_WORKSPACE/core-2512-ipq.sh" ln-openwrt

      - name: Apply device and feature options
        run: |
          "$GITHUB_WORKSPACE/core-2512-ipq.sh" init-openwrt-patch

      - name: Add SFE
        id: sfe
        if: env.SFE_INPUT_STATUS == 'true'
        run: |
          "$GITHUB_WORKSPACE/core-2512-ipq.sh" add-openwrt-sfe-2512
          echo "SFE=_SFE" >> "$GITHUB_ENV"
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Add non-SFE IPQ packages
        if: env.SFE_INPUT_STATUS != 'true'
        run: |
          "$GITHUB_WORKSPACE/core-2512-ipq.sh" add-openwrt-nosfe-ipq-2512

      - name: Add repository files and patches
        if: steps.clone.outputs.status == 'success'
        id: files
        run: |
          "$GITHUB_WORKSPACE/core-2512-ipq.sh" add-openwrt-files
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Set LAN IP
        if: github.event.inputs.SETIP != '' && github.event.inputs.SETIP != '192.168.10.1'
        run: |
          IPSET_VALUE="${{ github.event.inputs.SETIP }}"
          sed -i "s/192\.168\.10\.1/$IPSET_VALUE/g" openwrt/package/kochiya/autoset/files/def_uci/zzz-autoset*

      - name: Update and install feeds
        if: steps.files.outputs.status == 'success'
        id: feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          (cp -r $GITHUB_WORKSPACE/openwrt-2512-ipq/feeds-replace/luci/* feeds/luci/ && echo "luci-lib-docker Re-add")
          rm -rf feeds/luci.index
          (rm -rf feeds/packages/lang/golang && cp -r $GITHUB_WORKSPACE/$OpenWrt_REPO_ENV_FILE/feeds-packages-replace/* feeds/packages/ && echo "Golang Replaced")
          rm -rf feeds/packages.index
          ./scripts/feeds update luci packages
          ./scripts/feeds install -a
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Fix feeds and append package config
        if: steps.feeds.outputs.status == 'success'
        id: config
        env:
          INPUT_PKGS_CFG_STATUS: ${{ github.event.inputs.packages_mod || github.event.client_payload.packages_mod || 'm' }}
          INPUT_PKGS_CFG_FOO: ${{ github.event.inputs.packages || github.event.client_payload.packages || '' }}
        run: |
          "$GITHUB_WORKSPACE/core-2512-ipq.sh" fix-openwrt-feeds
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Add all kernel modules
        if: steps.config.outputs.status == 'success' && env.ALLKMOD == '1'
        run: |
          "$GITHUB_WORKSPACE/core-2512-ipq.sh" add-openwrt-kmods
      - name: Run awk command
        if: steps.config.outputs.status == 'success'
        working-directory: ./openwrt
        run: |
          echo "------------------------"
          awk '/CONFIG_LINUX/ { print }' .config
          awk '/${{matrix.target}}/ { print }' .config
          echo "------------------------"
          awk '/apk/ { print }' .config
          echo "------------------------"
          awk '/mediatek/ { print }' .config
          echo "------------------------"
          awk '/store/ { print }' .config

      - name: 编译 tools + toolchain
        working-directory: ./openwrt
        run: |
          echo -e "$(nproc) thread toolchain compile"
          make -j$(nproc) tools/install toolchain/install

      - name: 打包并上传工具链缓存到 Release
        working-directory: ./openwrt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          command -v zstd >/dev/null || sudo apt-get install -y -qq zstd
          TC_HASH=$(git log --pretty=tformat:"%h" -n1 tools toolchain)
          TC_TARGET="${{ matrix.target }}"
          TC_TARGET="${TC_TARGET%-nftables}"
          TC_SUFFIX="${eBPF:-}"
          ASSET="toolchain-${OpenWrt_PATCH_FILE_DIR}-${TC_TARGET}${TC_SUFFIX}-${TC_HASH}.tar.zst"
          echo "toolchain hash: $TC_HASH / asset: $ASSET"
          gh release view toolchain-cache >/dev/null 2>&1 || \
            gh release create toolchain-cache -t "toolchain-cache" -n "Independent toolchain caches for firmware builds"
          tar -cf - staging_dir/host* staging_dir/tool* | zstd -3 -T0 -q -o "/tmp/$ASSET"
          ls -lh "/tmp/$ASSET"
          gh release upload toolchain-cache "/tmp/$ASSET" --clobber
          # 同一 target/eBPF 只保留最新一份，避免 Release 资产无限增长
          gh release view toolchain-cache --json assets --jq '.assets[].name' 2>/dev/null |
            grep -F "toolchain-${OpenWrt_PATCH_FILE_DIR}-${TC_TARGET}${TC_SUFFIX}-" |
            grep -vxF "$ASSET" |
            while read -r old; do
              [ -n "$old" ] && gh release delete-asset toolchain-cache "$old" -y || true
            done
