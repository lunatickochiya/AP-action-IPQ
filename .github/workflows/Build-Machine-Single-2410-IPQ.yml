name: Build OpenWrt 24.10 IPQ Single Machine

# Fix for broken build: https://github.com/softprops/action-gh-release/issues/236
permissions:
  contents: write
  actions: write

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      config_repo:
        description: 'Use json config repo true(1) or false(0) See ReadME'
        required: true
        default: '{"Cache": "1", "CacheSave": "false", "CacheSaveOnFailure": "true", "UPLOAD_RELEASE": "1", "ALLKMOD": "1"}'

      MACH:
        description: 'Choose machine'
        required: true
        default: 'aliyun_ap8220'
        type: choice
        options:
        - 'link_nn6000-v2-lite'
        - 'link_nn6000-v2'
        - 'link_nn6000-v2-12m'
        - 'link_nn6000-v2-12m-lite'
        - 'aliyun_ap8220'
        - 'aliyun_ap8220-12m'
        - 'jdcloud_re-ss-01'
        - 'jdcloud_re-ss-01-12m'

      SFE_BUILDIN:
        description: 'Build sfe'
        default: 'true'
        type: choice
        options:
        - 'true'
        - 'false'

      packages:
        description: 'OpenWrt packages（example: luci-app-example,luci-app-helloworld）'
        required: true
        default: 'luci-app-mwan-switch,luci-app-example2'
      packages_mod:
        description: 'The Above packages set to which'
        default: 'm'
        type: choice
        options:
        - 'y'
        - 'm'
        - 'n'

      SETIP:
        description: 'Set ip address'
        default: '192.168.17.1'
        required: false
        type: choice
        options:
        - '192.168.6.1'
        - '192.168.7.1'
        - '192.168.8.1'
        - '192.168.8.6'
        - '192.168.8.7'
        - '192.168.8.8'
        - '192.168.8.66'
        - '192.168.9.1'
        - '192.168.10.1'
        - '192.168.11.1'
        - '192.168.12.1'
        - '192.168.16.1'
        - '192.168.17.1'
        - '192.168.17.17'
        - '192.168.17.8'
        - '192.168.17.7'
        - '192.168.17.66'
        - '192.168.17.77'
        - '192.168.18.1'
        - '192.168.19.1'
        - '192.168.20.1'
        - '192.168.22.1'
        - '192.168.33.1'
        - '192.168.66.1'
        - '192.168.67.1'
        - '192.168.77.1'
        - '192.168.78.1'
        - '192.168.87.1'
        - '192.168.88.1'
        - '192.168.89.1'
        - '192.168.96.1'
        - '192.168.99.1'
        - '192.168.100.1'
        - '192.168.110.1'
        - '192.168.120.1'
        - '192.168.160.1'
        - '192.168.166.1'
        - '192.168.167.1'
        - '192.168.177.1'
        - '192.168.188.1'
        - '172.16.0.1'
        - '172.18.0.1'
        - '10.0.0.1'
        - '10.88.0.1'

      patch_repo:
        description: 'Use json patch repo true(1) or false(0) See ReadME'
        required: true
        default: '{"Branch": "24.10-nss-dev","IPQ_Firmware": "ipq-nss-11-4","OPENSSL_3_5": "1", "BCM_FULLCONE": "1", "TRY_BBR_V3": "1", "Firewall_Allow_WAN": "0", "ADD_IB": "1", "ADD_SDK": "1", "ADD_eBPF": "0", "ADD_SKB_RECYCLER": "1", "DOCKER_BUILDIN": "0"}'

env:
  TZ: Asia/Shanghai
  OpenWrt_PATCH_FILE_DIR: openwrt-2410-ipq

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      machine: ${{ steps.set-matrix.outputs.machine }}
    env:
      Target_CFG_Machine: ${{ github.event.inputs.MACH || github.event.client_payload.MACH }}

    steps:
      - name: 检查
        uses: actions/checkout@main
      
      - name: 生成矩阵配置
        id: set-matrix
        run: bash "$GITHUB_WORKSPACE/core-2410-ipq.sh" resolve-build-matrix
 
  build:
    runs-on: Ubuntu-24.04
    timeout-minutes: 720
    needs: prepare
    env:
      Matrix_Target: ${{ matrix.target }}
      Target_CFG_Machine: ${{ needs.prepare.outputs.machine }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: Build ${{ needs.prepare.outputs.machine }} openwrt 24.10

    steps:
    - name: 检查
      uses: actions/checkout@main

    - name: Print matrix from prepare
      run: |
         echo "::notice ::Matrix from prepare: ${{ needs.prepare.outputs.matrix }}"

    - name: 检查服务器配置
      run: |
        echo -e "------------------------------- CPU信息 -------------------------------\n"
        echo "CPU物理数量:$(cat /proc/cpuinfo| grep "physical id"| sort| uniq| wc -l)"
        echo -e "CPU核心及版本信息: $(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
        echo -e "------------------------------- 内存信息 -------------------------------\n"
        echo "已安装内存详细信息: "
        sudo lshw -short -C memory | grep GiB
        echo -e "\n"
        echo -e "------------------------------- 磁盘信息 -------------------------------\n"
        echo -e "磁盘数量: $(ls /dev/sd* | grep -v [1-9] | wc -l) \n"
        echo "------------------------------- 磁盘详情 -------------------------------\n"
        df -Th

    - name: 释放Ubuntu磁盘空间
      uses: endersonmenezes/free-disk-space@v2
      with:
        remove_android: true
        remove_dotnet: true
        remove_haskell: true
        remove_tool_cache: true
        remove_swap: true
        remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
        remove_packages_one_command: true
        remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/share/glade* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell"
        testing: false
  
    - name: 初始化环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        chmod +x gen-sha256sum.sh add-test-packages.sh add-sfe-packages.sh core-2410-ipq.sh
        $GITHUB_WORKSPACE/core-2410-ipq.sh init-pkg-env

    - name: 设置GITHUB_ENV
      id: env
      env:
        PATCH_JSON_INPUT: ${{ github.event.inputs.patch_repo }}
        CONFIG_JSON_INPUT: ${{ github.event.inputs.config_repo }}
      run: |
        echo ${{matrix.target}}
        $GITHUB_WORKSPACE/core-2410-ipq.sh init-gh-env

    - name: 克隆源代码
      working-directory: /workdir
      id: clone
      env:
        OPENWRT_REPO_SSH_KEY: ${{ secrets.OPENWRT_REPO_SSH_KEY }}
      run: |
        df -hT $PWD
        if [ ${{ env.Branch}} = 24.10-nss-dev-618 ]; then
        if [ -z "$OPENWRT_REPO_SSH_KEY" ]; then
        echo "::error::secret OPENWRT_REPO_SSH_KEY 未设置（私有仓库只读 Deploy Key 私钥）"
        exit 1
        fi
        mkdir -p ~/.ssh && chmod 700 ~/.ssh
        printf '%s\n' "$OPENWRT_REPO_SSH_KEY" > ~/.ssh/openwrt_repo_key
        chmod 600 ~/.ssh/openwrt_repo_key
        export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/openwrt_repo_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new"
        git clone git@github.com:lunatickochiya/openwrt-ipq-2410.git -b $Branch openwrt --single-branch
        else
        git clone $REPO_URL -b $Branch openwrt --single-branch
        fi
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
        cd openwrt
        sed -i \
          -e 's|https://git.openwrt.org/feed/packages.git;openwrt-24.10|https://github.com/openwrt/packages.git;openwrt-24.10|' \
          -e 's|https://git.openwrt.org/project/luci.git;openwrt-24.10|https://github.com/openwrt/luci.git;openwrt-24.10|' \
          -e 's|https://git.openwrt.org/feed/routing.git;openwrt-24.10|https://github.com/openwrt/routing.git;openwrt-24.10|' \
          -e 's|https://git.openwrt.org/feed/telephony.git;openwrt-24.10|https://github.com/openwrt/telephony.git;openwrt-24.10|' \
          feeds.conf.default
        sed -i '$a src-git lunatic7 https://github.com/lunatickochiya/luna-action-packages.git' feeds.conf.default
        cd ../
        #if [ ${{ env.Branch}} = 24.10-nss-dev-618 ]; then
        #mv -f openwrt/nss-setup/batman-fix $GITHUB_WORKSPACE/batman-2410
        #fi
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 增加磁盘空间
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        $GITHUB_WORKSPACE/core-2410-ipq.sh ln-openwrt

    - name: Patch 自定义
      id: patch
      run: |
        $GITHUB_WORKSPACE/core-2410-ipq.sh init-openwrt-patch
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 添加 SFE
      id: sfe
      run: |
        if [ ${{github.event.inputs.SFE_BUILDIN}} = true ]; then
        $GITHUB_WORKSPACE/core-2410-ipq.sh add-openwrt-sfe-2410-ipq
        else
        $GITHUB_WORKSPACE/core-2410-ipq.sh add-openwrt-nosfe-2410-ipq
        fi
        rm -rf openwrt/tmp
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 自定义安装包(优先于feeds)
      if: steps.clone.outputs.status == 'success'
      id: files
      env:
        SFE_INPUT_STATUS: ${{ github.event.inputs.SFE_BUILDIN }}
      run: |
        $GITHUB_WORKSPACE/core-2410-ipq.sh add-openwrt-files
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 设置 IP 地址
      if: github.event.inputs.SETIP != '192.168.10.1'
      id: setip
      run: |
        IPSET_VALUE="${{ github.event.inputs.SETIP }}"
        sed -i "s/192\.168\.10\.1/$IPSET_VALUE/g" openwrt/package/kochiya/autoset/files/def_uci/zzz-autoset*
        grep 'set network.lan.ipaddr=' openwrt/package/kochiya/autoset/files/def_uci/zzz-autoset*
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 更新 & 安装 feeds
      if: steps.files.outputs.status == 'success'
      id: feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        #(cd feeds/packages && curl -sL https://github.com/openwrt/packages/commit/0bcc41f3617e9041513a779a8a54f7fecae1efcd.patch | patch -p1 && echo "Rust 1.94.0 Patch applied")
        #sed -i 's/--set=llvm\.download-ci-llvm=false/--set=llvm.download-ci-llvm=true/' feeds/packages/lang/rust/Makefile
        grep -q -- '--ci false \\' feeds/packages/lang/rust/Makefile || sed -i '/x\.py \\/a \        --ci false \\' feeds/packages/lang/rust/Makefile
        (rm -rf feeds/packages/lang/golang && cp -r $GITHUB_WORKSPACE/$OpenWrt_PATCH_FILE_DIR/feeds-packages-replace/* feeds/packages/ && echo "Golang Repalced")
        rm -rf feeds/packages.index
        ./scripts/feeds update packages
        ./scripts/feeds install -a
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 自定义配置（修复feeds）
      if: steps.feeds.outputs.status == 'success'
      id: config
      env:
        INPUT_PKGS_CFG_STATUS: ${{ github.event.inputs.packages_mod }}
        INPUT_PKGS_CFG_FOO: ${{ github.event.inputs.packages }}"
        SFE_INPUT_STATUS: ${{ github.event.inputs.SFE_BUILDIN }}
      run: |
        $GITHUB_WORKSPACE/core-2410-ipq.sh fix-openwrt-feeds
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 添加kmod
      if: steps.config.outputs.status == 'success' && env.ALLKMOD == '1'
      id: config2
      run: |
        $GITHUB_WORKSPACE/core-2410-ipq.sh add-openwrt-kmods
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Run awk command
      if: steps.config.outputs.status == 'success'
      working-directory: ./openwrt
      run: |
        $GITHUB_WORKSPACE/core-2410-ipq.sh awk-openwrt-config

    - name: 准备宿主工具链（Rust/Go/LLVM/Python）
      if: steps.config.outputs.status == 'success'
      working-directory: ./openwrt
      run: |
        # rust：用 runner 的 rustup 替换 rust/host 源码构建
        bash "$GITHUB_WORKSPACE/.github/scripts/prepare-rust.sh" || \
          echo "::warning ::Rust 注入失败，回退到源码构建"
        # Go / eBPF LLVM / host Python PGO：能用 runner 的就不从源码编
        bash "$GITHUB_WORKSPACE/.github/scripts/prepare-build-host.sh" || \
          echo "::warning ::宿主工具链准备失败，保持 OpenWrt 默认行为"

    - name: 注入编译耗时统计
      if: steps.config.outputs.status == 'success'
      working-directory: ./openwrt
      run: |
        python3 "$GITHUB_WORKSPACE/.github/scripts/patch-build-time-log.py" . \
          --scripts-dir "$GITHUB_WORKSPACE/.github/scripts" || \
          echo "::warning ::编译耗时统计注入失败，跳过报告"

    - name: 下载包文件
      if: steps.config.outputs.status == 'success'
      run: |
        cd openwrt
        make download -j$(nproc)
        find dl -size -1024c -exec rm -f {} \;

    - name: 缓存staging
      id: cache
      # fork（lunatickochiya/cachewrtbuild@save-on-failure）：config_repo 的
      # CacheSaveOnFailure（默认 "true"）由 core-2410-ipq.sh 导出成 env
      # CACHEWRT_SAVE_ON_FAILURE，fork 的 post-if 读它 —— 编译失败也执行 post 保存，
      # 这样 tools/toolchain 编完后即使后面包编译/打包失败，缓存也不会白编。
      uses: lunatickochiya/cachewrtbuild@save-on-failure
      if: env.Cache == '1' && !cancelled()
      with:
        ccache: 'true'
        mixkey: ${{ matrix.target }}${{ env.eBPF }}${{ env.Branch }}
        prefix: ${{ github.workspace }}/openwrt
        skip_saving: ${{ env.CacheSave }}

    - name: 恢复工具链（Release 兜底）
      # Actions cache 未命中时，从 toolchain-cache Release 下载同 target/同 tools+toolchain
      # hash 的压缩包；没有就退回现场编译，不阻断构建。
      if: env.Cache == '1' && steps.cache.outputs.hit != '1'
      working-directory: ./openwrt
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        command -v zstd >/dev/null || sudo apt-get install -y -qq zstd
        TC_HASH=$(git log --pretty=tformat:"%h" -n1 tools toolchain)
        TC_TARGET="${Matrix_Target%-iptables}"
        TC_TARGET="${TC_TARGET%-nftables}"
        TC_SUFFIX="${eBPF:-}"
        ASSET="toolchain-${OpenWrt_PATCH_FILE_DIR}-${TC_TARGET}${TC_SUFFIX}-${TC_HASH}.tar.zst"
        if gh release download toolchain-cache -p "$ASSET" -D /tmp --clobber 2>/dev/null; then
          echo "从 Release 恢复工具链：$ASSET"
          tar --zstd -xf "/tmp/$ASSET" -C .
          sed -i 's/ $(tool.*\/stamp-compile)//;' Makefile
          sed -i 's/ $(tool.*\/stamp-install)//;' Makefile
        else
          echo "::notice ::未找到 $ASSET，本次现场编译工具链"
        fi

    - name: 修正工具链缓存时间戳
      # actions/cache 解压后 mtime 可能早于源码，make 会把 host/tool stamp 判为过期。
      if: (!cancelled())
      working-directory: ./openwrt
      run: |
        if [ -d staging_dir ]; then
          find staging_dir -type d -name stamp -not -path "*target*" -print0 2>/dev/null |
            while IFS= read -r -d '' d; do
              find "$d" -type f -exec touch {} + 2>/dev/null || true
            done
        fi
        mkdir -p tmp
        echo 1 > tmp/.build

    - name: 编译固件
      id: compile
      working-directory: ./openwrt
      env:
        # 每个包的 prepare/configure/compile/install 起止时间
        BUILD_TIME_LOG: 'build-time.tsv'
      run: |
        echo -e "$(($(nproc)+1)) thread compile"
        make -j$(($(nproc)+1)) || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 生成编译耗时报告
      # 失败也生成，便于判断是哪个包/阶段拖慢或卡住
      if: always()
      continue-on-error: true
      working-directory: ./openwrt
      run: |
        if [ -s build-time.tsv ]; then
          scripts/build-time-report.pl -n 30 build-time.tsv > build-time-report.txt 2>&1 || true
          cp -f build-time-report.txt "$GITHUB_WORKSPACE/build-time-report.txt" || true
          echo "===== 编译耗时 Top 30 ====="
          cat build-time-report.txt || true
        else
          echo "::notice ::没有 build-time.tsv，跳过耗时报告"
        fi

    - name: 上传编译耗时报告
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@main
      with:
        name: build-time-${{ matrix.target }}
        path: build-time-report.txt
        if-no-files-found: ignore
        retention-days: 7

    - name: 检查空间使用情况
      if: (!cancelled())
      run: df -hT

    - name: 上传bin目录
      uses: actions/upload-artifact@main
      continue-on-error: true
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: ${{ env.date3 }}_${{matrix.target}}
        path: |
          openwrt/bin/

    - name: 打包ipk成zip文件
      id: afb
      continue-on-error: true
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        $GITHUB_WORKSPACE/$DIY_SH_AFB
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 整理文件
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && steps.afb.outputs.status == 'success' && !cancelled()
      run: |
        mkdir firmware ipks
        [ ${{ env.UPLOAD_RELEASE}} = 1 ] && cp -u -f openwrt/kernelipks.zip firmware
        [ ${{ env.UPLOAD_RELEASE}} = 1 ] && cp -u -f openwrt/ipks.zip firmware
        cp -u -f openwrt/kernelipks.zip ipks
        cp -u -f openwrt/ipks.zip ipks
        mv -f openwrt/bin/targets/*/*/{*combined*,*ext4*,*sdk*,*imagebuilder*,*buildinfo*,*manifest*,*json*,*sha256sums*} ./firmware/ 2>/dev/null || true
        [ $UPLOAD_SYSUPGRADE = true ] && mv -f openwrt/bin/targets/*/*/{*combined*,*sysupgrade*,*openwrt*,*initramfs*,*factory*} ./firmware/ 2>/dev/null || true
        cp openwrt/.config  ./firmware/${{matrix.target}}.config
        cp openwrt/build_dir/target-*/linux-*/linux-*/.config ./firmware/${{matrix.target}}_kernel.config
        cd firmware
        echo "v${{ env.date2 }}" > version.txt
        echo ${{matrix.target}} >> version.txt
        rm -rf sha256sums
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 上传firmware目录
      uses: actions/upload-artifact@main
      continue-on-error: true
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
      with:
        name: ${{ env.date3 }}_${{matrix.target}}_firmware_24.10-${{ env.Target_CFG_Machine }}-${{ github.event.inputs.SETIP }}${{ env.Kernel_Test }}${{ env.BCM_FULLCONE_NAME }}${{ env.SFE }}${{ env.TRY_BBR_V3_NAME }}${{ env.OPENSSL_3_5_NAME }}${{ env.DOCKER_NAME }}${{ env.WAN_NAME }}_${{ env.Branch }}_${{ env.IPQ_Firmware }}${{ env.eBPF }}
        path: |
          firmware

    - name: 上传ipk目录
      uses: actions/upload-artifact@main
      continue-on-error: true
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_IPK_DIR == 'true' && steps.afb.outputs.status == 'success'
      with:
        name: ${{ env.date3 }}_${{matrix.target}}_ipks_24.10-${{ env.Target_CFG_Machine }}${{ env.Kernel_Test }}${{ env.BCM_FULLCONE_NAME }}${{ env.SFE }}${{ env.TRY_BBR_V3_NAME }}${{ env.OPENSSL_3_5_NAME }}${{ env.DOCKER_NAME }}${{ env.WAN_NAME }}_${{ env.Branch }}_${{ env.IPQ_Firmware }}${{ env.eBPF }}
        path: |
          ipks

    - name: 上传固件cowtransfer
      id: cowtransfer
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_COWTRANSFER == 'true' && !cancelled()
      run: |
        curl -fsSL git.io/file-transfer | sh
        ./transfer cow --block 2621440 -s -p 64 --no-progress ${FIRMWARE} 2>&1 | tee cowtransfer.log
        echo "::warning file=cowtransfer.com::$(cat cowtransfer.log | grep https)"
        echo "url=$(cat cowtransfer.log | grep https | cut -f3 -d" ")" >> $GITHUB_OUTPUT

    - name: 上传固件WeTransfer
      id: wetransfer
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_WETRANSFER == 'true' && !cancelled()
      run: |
        curl -fsSL git.io/file-transfer | sh
        ./transfer wet -s -p 16 --no-progress ${FIRMWARE} 2>&1 | tee wetransfer.log
        echo "::warning file=wetransfer.com::$(cat wetransfer.log | grep https)"
        echo "url=$(cat wetransfer.log | grep https | cut -f3 -d" ")" >> $GITHUB_OUTPUT

    - name: 生成发布标签
      id: tag
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_RELEASE == '1' && !cancelled()
      run: |
        touch release.txt
        $GITHUB_WORKSPACE/gen-sha256sum.sh
        echo "# 当前固件IP地址："${{ github.event.inputs.SETIP }}" " >> release.txt
        [ ${{matrix.target}} = mt798x* ] && [ -e openwrt/target/linux/mediatek/filogic/base-files/lib/firmware/mediatek/nx30pro_eeprom.bin ] && echo "- eeprom 使用 H3C NX30 Pro 提取版本" >> release.txt
        [ $UPLOAD_COWTRANSFER = true ] && echo "🔗 [Cowtransfer](${{ steps.cowtransfer.outputs.url }})" >> release.txt
        [ $UPLOAD_WETRANSFER = true ] && echo "🔗 [WeTransfer](${{ steps.wetransfer.outputs.url }})" >> release.txt
        echo "🔗 ${{ env.BCM_FULLCONE_NAME }}${{ env.SFE }}${{ env.TRY_BBR_V3_NAME }}${{ env.OPENSSL_3_5_NAME }}" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 上传固件发布
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        files: "${{ env.FIRMWARE }}/*"
        name: ${{ env.date }} ${{matrix.target}}-${{ env.Target_CFG_Machine }}-openwrt-2410-ipq
        tag_name: ${{ env.date }}_${{matrix.target}}-${{ env.Target_CFG_Machine }}-openwrt-2410-ipq
        body_path: release.txt

    - name: 删除工作流
      uses: Mattraks/delete-workflow-runs@main
      continue-on-error: true
      with:
        retain_days: 10
        keep_minimum_runs: 20

    - name: 删除旧版本
      uses: dev-drprasad/delete-older-releases@master
      if: env.UPLOAD_RELEASE == '1' && !cancelled()
      continue-on-error: true
      with:
        keep_latest: 99
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
