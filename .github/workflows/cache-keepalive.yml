          restore-keys: ramips-iptables_eBPF
          lookup-only: true

      - name: Touch ramips-iptables
        id: ramips_iptables
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: /tmp/dummy
          key: ramips-iptables
          restore-keys: ramips-iptables
          lookup-only: true

      - name: Touch ramips-nftables_eBPF
        id: ramips_nftables_ebpf
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: /tmp/dummy
          key: ramips-nftables_eBPF
          restore-keys: ramips-nftables_eBPF
          lookup-only: true

      - name: Touch ramips-nftables
        id: ramips_nftables
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: /tmp/dummy
          key: ramips-nftables
          restore-keys: ramips-nftables
          lookup-only: true

      - name: Summary
        run: |
          echo "matched cache keys:"
          echo "  ath79-iptables_eBPF: ${{ steps.ath79_iptables_ebpf.outputs.cache-matched-key }}"
          echo "  ath79-iptables: ${{ steps.ath79_iptables.outputs.cache-matched-key }}"
          echo "  ath79-nftables_eBPF: ${{ steps.ath79_nftables_ebpf.outputs.cache-matched-key }}"
          echo "  ath79-nftables: ${{ steps.ath79_nftables.outputs.cache-matched-key }}"
          echo "  ipq-iptables_eBPF: ${{ steps.ipq_iptables_ebpf.outputs.cache-matched-key }}"
          echo "  ipq-iptables: ${{ steps.ipq_iptables.outputs.cache-matched-key }}"
          echo "  ipq-nftables_eBPF: ${{ steps.ipq_nftables_ebpf.outputs.cache-matched-key }}"
          echo "  ipq-nftables: ${{ steps.ipq_nftables.outputs.cache-matched-key }}"
          echo "  mt798x-iptables_eBPF: ${{ steps.mt798x_iptables_ebpf.outputs.cache-matched-key }}"
          echo "  mt798x-iptables: ${{ steps.mt798x_iptables.outputs.cache-matched-key }}"
          echo "  mt798x-nftables_eBPF: ${{ steps.mt798x_nftables_ebpf.outputs.cache-matched-key }}"
          echo "  mt798x-nftables: ${{ steps.mt798x_nftables.outputs.cache-matched-key }}"
          echo "  mt798x-nousb-iptables_eBPF: ${{ steps.mt798x_nousb_iptables_ebpf.outputs.cache-matched-key }}"
          echo "  mt798x-nousb-iptables: ${{ steps.mt798x_nousb_iptables.outputs.cache-matched-key }}"
          echo "  mt798x-nousb-nftables_eBPF: ${{ steps.mt798x_nousb_nftables_ebpf.outputs.cache-matched-key }}"
          echo "  mt798x-nousb-nftables: ${{ steps.mt798x_nousb_nftables.outputs.cache-matched-key }}"
          echo "  ramips-iptables_eBPF: ${{ steps.ramips_iptables_ebpf.outputs.cache-matched-key }}"
          echo "  ramips-iptables: ${{ steps.ramips_iptables.outputs.cache-matched-key }}"
          echo "  ramips-nftables_eBPF: ${{ steps.ramips_nftables_ebpf.outputs.cache-matched-key }}"
          echo "  ramips-nftables: ${{ steps.ramips_nftables.outputs.cache-matched-key }}"
