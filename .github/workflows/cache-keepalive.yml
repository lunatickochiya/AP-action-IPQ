          lookup-only: true

      - name: Touch mt798x-nousb-iptables
        id: mt798x_nousb_iptables
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: /tmp/dummy
          key: mt798x-nousb-iptables
          restore-keys: mt798x-nousb-iptables
          lookup-only: true

      - name: Touch mt798x-nousb-nftables_eBPF
        id: mt798x_nousb_nftables_ebpf
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: /tmp/dummy
          key: mt798x-nousb-nftables_eBPF
          restore-keys: mt798x-nousb-nftables_eBPF
          lookup-only: true

      - name: Touch mt798x-nousb-nftables
        id: mt798x_nousb_nftables
        continue-on-error: true
        uses: actions/cache/restore@v5
