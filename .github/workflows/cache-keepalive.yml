name: Keep Cache Alive

# actions/cache 的条目 7 天不访问会被回收。
# cachewrtbuild 生成的缓存 key 形如：
#   <target><eBPF><Branch>-cache-openwrt-<toolchain-hash>-<timestamp>
# 每 5 天用 lookup-only（只查询不下载）触碰各 target 的最近缓存，
# 保证常用机型不用每次重编工具链。
# 参考：qwe3017/Actions-OpenWrt-AN758X/.github/workflows/cache-keepalive.yml
on:
  schedule:
    - cron: '0 0 */5 * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Touch ath79-iptables_eBPF
        id: ath79_iptables_ebpf
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: /tmp/dummy
          key: ath79-iptables_eBPF
          restore-keys: ath79-iptables_eBPF
          lookup-only: true

      - name: Touch ath79-iptables
        id: ath79_iptables
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: /tmp/dummy
          key: ath79-iptables
          restore-keys: ath79-iptables
          lookup-only: true

      - name: Touch ath79-nftables_eBPF
        id: ath79_nftables_ebpf
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: /tmp/dummy
          key: ath79-nftables_eBPF
          restore-keys: ath79-nftables_eBPF
          lookup-only: true

      - name: Touch ath79-nftables
        id: ath79_nftables
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: /tmp/dummy
          key: ath79-nftables
          restore-keys: ath79-nftables
          lookup-only: true

      - name: Touch ipq-iptables_eBPF
        id: ipq_iptables_ebpf
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: /tmp/dummy
          key: ipq-iptables_eBPF
          restore-keys: ipq-iptables_eBPF
          lookup-only: true

      - name: Touch ipq-iptables
        id: ipq_iptables
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: /tmp/dummy
          key: ipq-iptables
          restore-keys: ipq-iptables
          lookup-only: true

      - name: Touch ipq-nftables_eBPF
        id: ipq_nftables_ebpf
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: /tmp/dummy
          key: ipq-nftables_eBPF
          restore-keys: ipq-nftables_eBPF
          lookup-only: true

      - name: Touch ipq-nftables
        id: ipq_nftables
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: /tmp/dummy
          key: ipq-nftables
          restore-keys: ipq-nftables
          lookup-only: true

      - name: Touch mt798x-iptables_eBPF
        id: mt798x_iptables_ebpf
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: /tmp/dummy
          key: mt798x-iptables_eBPF
          restore-keys: mt798x-iptables_eBPF
          lookup-only: true

      - name: Touch mt798x-iptables
        id: mt798x_iptables
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: /tmp/dummy
          key: mt798x-iptables
          restore-keys: mt798x-iptables
          lookup-only: true

      - name: Touch mt798x-nftables_eBPF
        id: mt798x_nftables_ebpf
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: /tmp/dummy
          key: mt798x-nftables_eBPF
          restore-keys: mt798x-nftables_eBPF
          lookup-only: true

      - name: Touch mt798x-nftables
        id: mt798x_nftables
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: /tmp/dummy
