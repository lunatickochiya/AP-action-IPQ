name: Build OpenWrt-IPQ 25.12 Single Machine

permissions:
  contents: write
  actions: write

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      config_repo:
        description: 'Build and upload options'
        required: true
        default: '{"Cache":"1","CacheSave":"false","UPLOAD_RELEASE":"1","ALLKMOD":"1"}'
      MACH:
        description: 'Choose machine'
        required: true
        default: 'aliyun_ap8220'
        type: choice
        options:
        - 'link_nn6000-v2-lite'
        - 'link_nn6000-v2'
        - 'link_nn6000-v2-12m'
        - 'link_nn6000-v2-12m-lite'
        - 'aliyun_ap8220'
        - 'aliyun_ap8220-12m'
        - 'jdcloud_re-ss-01'
        - 'jdcloud_re-ss-01-12m'
      SFE_BUILDIN:
        description: 'Build SFE acceleration'
        default: 'true'
        type: choice
        options:
        - 'true'
        - 'false'
      patch_repo:
        description: 'IPQ 25.12 branch and feature options'
        required: true
        default: '{"Branch":"25.12-nss-6.6-dev","IPQ_Firmware":"ipq-nss-12-5","BCM_FULLCONE":"1","TRY_BBR_V3":"1","KERNEL66":"1","Firewall_Allow_WAN":"0","ADD_IB":"1","ADD_SDK":"1","ADD_eBPF":"0","ADD_SKB_RECYCLER":"1","DOCKER_BUILDIN":"0"}'
      SETIP:
        description: 'Set LAN IP address'
        default: '192.168.17.1'
        required: false
      packages:
        description: 'Additional packages'
        required: true
        default: 'luci-app-mwan-switch'
      packages_mod:
        description: 'Additional package mode'
        default: 'm'
        type: choice
        options:
        - 'y'
        - 'm'
        - 'n'

env:
  TZ: Asia/Shanghai
  OpenWrt_PATCH_FILE_DIR: openwrt-ipq
  OpenWrt_REPO_ENV_FILE: openwrt-ipq-2512
  KERNEL66_REPO_TOKEN: ${{ secrets.MY_SECRET_TOKEN }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      machine: ${{ steps.set-matrix.outputs.machine }}
    env:
      Target_CFG_Machine: ${{ github.event.inputs.MACH || github.event.client_payload.MACH }}
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: Resolve build matrix
        id: set-matrix
        run: bash "$GITHUB_WORKSPACE/core-2512.sh" resolve-build-matrix

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 720
    needs: prepare
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: Build ${{ needs.prepare.outputs.machine }} ${{ matrix.target }} OpenWrt 25.12 IPQ
    env:
      Matrix_Target: ${{ matrix.target }}
      Target_CFG_Machine: ${{ needs.prepare.outputs.machine }}
      SFE_INPUT_STATUS: ${{ github.event.inputs.SFE_BUILDIN || github.event.client_payload.SFE_BUILDIN || 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: check server conf
        run: |
          echo -e "------------------------------- CPU信息 -------------------------------\n"
          echo "CPU物理数量:$(cat /proc/cpuinfo| grep "physical id"| sort| uniq| wc -l)"
          echo -e "CPU核心及版本信息: $(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
          echo -e "------------------------------- 内存信息 -------------------------------\n"
          echo "已安装内存详细信息: "
          sudo lshw -short -C memory | grep GiB
          echo -e "\n"
          echo -e "------------------------------- 磁盘信息 -------------------------------\n"
          echo -e "磁盘数量: $(ls /dev/sd* | grep -v [1-9] | wc -l) \n"
          echo "------------------------------- 磁盘详情 -------------------------------\n"
          df -Th

      - name: free up disk space
        uses: endersonmenezes/free-disk-space@v2
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/share/glade* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell"
          testing: false

      - name: 检查空间使用情况
        if: (!cancelled())
        run: df -hT

      - name: Initialize build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          chmod +x core-2512.sh gen-sha256sum.sh after_build.sh archive/diy-openwrt-ipq.sh
          "$GITHUB_WORKSPACE/core-2512.sh" init-pkg-env

      - name: Export build options
        env:
          PATCH_JSON_INPUT: '${{ github.event.inputs.patch_repo || github.event.client_payload.patch_repo }}'
          CONFIG_JSON_INPUT: '${{ github.event.inputs.config_repo || github.event.client_payload.config_repo }}'
        run: |
          "$GITHUB_WORKSPACE/core-2512.sh" init-gh-env

      - name: Clone OpenWrt source
        working-directory: /workdir
        id: clone
        run: |
          git clone --single-branch --branch "$REPO_BRANCH" "$REPO_URL" openwrt
          ln -sf /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"
          cd openwrt
          sed -i \
            -e 's|https://git.openwrt.org/feed/packages.git;openwrt-25.12|https://github.com/openwrt/packages.git;openwrt-25.12|' \
            -e 's|https://git.openwrt.org/project/luci.git;openwrt-25.12|https://github.com/openwrt/luci.git;openwrt-25.12|' \
            -e 's|https://git.openwrt.org/feed/routing.git;openwrt-25.12|https://github.com/openwrt/routing.git;openwrt-25.12|' \
            -e 's|https://git.openwrt.org/feed/telephony.git;openwrt-25.12|https://github.com/openwrt/telephony.git;openwrt-25.12|' \
            feeds.conf.default
          grep -q 'src-git lunatic7' feeds.conf.default || \
            sed -i '$a src-git lunatic7 https://github.com/lunatickochiya/luna-action-packages.git' feeds.conf.default
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Link build cache
        run: |
          "$GITHUB_WORKSPACE/core-2512.sh" ln-openwrt

      - name: Apply device and feature options
        run: |
          "$GITHUB_WORKSPACE/core-2512.sh" init-openwrt-patch

      - name: Add SFE
        id: sfe
        if: env.SFE_INPUT_STATUS == 'true'
        run: |
          "$GITHUB_WORKSPACE/core-2512.sh" add-openwrt-sfe-2512
          echo "SFE=_SFE" >> "$GITHUB_ENV"
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Add non-SFE IPQ packages
        if: env.SFE_INPUT_STATUS != 'true'
        run: |
          "$GITHUB_WORKSPACE/core-2512.sh" add-openwrt-nosfe-ipq-2512

      - name: Add repository files and patches
        if: steps.clone.outputs.status == 'success'
        id: files
        run: |
          "$GITHUB_WORKSPACE/core-2512.sh" add-openwrt-files
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Set LAN IP
        if: github.event.inputs.SETIP != '' && github.event.inputs.SETIP != '192.168.10.1'
        run: |
          IPSET_VALUE="${{ github.event.inputs.SETIP }}"
          sed -i "s/192\.168\.10\.1/$IPSET_VALUE/g" openwrt/package/kochiya/autoset/files/def_uci/zzz-autoset*

      - name: Update and install feeds
        if: steps.files.outputs.status == 'success'
        id: feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          (cp -r $GITHUB_WORKSPACE/openwrt-2512/feeds-replace/luci/* feeds/luci/ && echo "luci-lib-docker Re-add")
          rm -rf feeds/luci.index
          ./scripts/feeds update luci
          ./scripts/feeds install -a
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Fix feeds and append package config
        if: steps.feeds.outputs.status == 'success'
        id: config
        env:
          INPUT_PKGS_CFG_STATUS: ${{ github.event.inputs.packages_mod || github.event.client_payload.packages_mod || 'm' }}
          INPUT_PKGS_CFG_FOO: ${{ github.event.inputs.packages || github.event.client_payload.packages || '' }}
        run: |
          "$GITHUB_WORKSPACE/core-2512.sh" fix-openwrt-feeds
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Add all kernel modules
        if: steps.config.outputs.status == 'success' && env.ALLKMOD == '1'
        run: |
          "$GITHUB_WORKSPACE/core-2512.sh" add-openwrt-kmods

      - name: Download sources
        if: steps.config.outputs.status == 'success'
        working-directory: ./openwrt
        run: |
          make download -j"$(nproc)"
          find dl -size -1024c -delete

      - name: Cache staging
        uses: HiGarfield/cachewrtbuild@main
        if: env.Cache == '1' && !cancelled()
        with:
          ccache: 'true'
          mixkey: ${{ matrix.target }}${{ env.eBPF }}${{ env.Branch }}
          prefix: ${{ github.workspace }}/openwrt
          skip_saving: ${{ env.CacheSave }}

      - name: Build firmware
        id: compile
        if: steps.config.outputs.status == 'success'
        working-directory: ./openwrt
        run: |
          make -j"$(($(nproc)+1))" || make -j1 V=s
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: 检查空间使用情况
        if: (!cancelled())
        run: df -hT

      - name: 上传bin目录
        uses: actions/upload-artifact@main
        continue-on-error: true
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
        with:
          name: ${{ env.date3 }}_${{matrix.target}}
          path: |
            openwrt/bin/

      - name: 打包ipk成zip文件
        id: afb
        continue-on-error: true
        if: steps.compile.outputs.status == 'success' && !cancelled()
        run: |
          $GITHUB_WORKSPACE/$DIY_SH_AFB
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 整理文件
        id: organize
        if: env.UPLOAD_FIRMWARE == 'true' && steps.afb.outputs.status == 'success' && !cancelled()
        run: |
          mkdir -p firmware ipks
          [ ${{ env.UPLOAD_RELEASE}} = 1 ] && cp -u -f openwrt/kernelipks.zip firmware
          [ ${{ env.UPLOAD_RELEASE}} = 1 ] && cp -u -f openwrt/ipks.zip firmware
          cp -u -f openwrt/kernelipks.zip ipks
          cp -u -f openwrt/ipks.zip ipks
          mv -f openwrt/bin/targets/*/*/{*combined*,*ext4*,*sdk*,*imagebuilder*,*buildinfo*,*manifest*,*json*,*sha256sums*} ./firmware/ 2>/dev/null || true
          [ $UPLOAD_SYSUPGRADE = true ] && mv -f openwrt/bin/targets/*/*/{*combined*,*sysupgrade*,*openwrt*,*initramfs*,*factory*} ./firmware/ 2>/dev/null || true
          cp openwrt/.config  ./firmware/${{matrix.target}}.config
          cp openwrt/build_dir/target-*/linux-*/linux-*/.config ./firmware/${{matrix.target}}_kernel.config
          cd firmware
          echo "v${{ env.date2 }}" > version.txt
          echo ${{matrix.target}} >> version.txt
          rm -rf sha256sums
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 上传firmware目录
        uses: actions/upload-artifact@main
        continue-on-error: true
        if: steps.organize.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
        with:
          name: ${{ env.date3 }}_${{matrix.target}}_firmware_25.12-${{ env.Target_CFG_Machine }}-${{ github.event.inputs.SETIP }}${{ env.Kernel_Test }}${{ env.KERNEL66_NAME }}${{ env.BCM_FULLCONE_NAME }}${{ env.SFE }}${{ env.TRY_BBR_V3_NAME }}${{ env.OPENSSL_3_5_NAME }}${{ env.DOCKER_NAME }}${{ env.WAN_NAME }}${{ env.MAC80211_616_NAME }}${{ env.eBPF }}
          path: |
            firmware

      - name: 上传软件包目录
        uses: actions/upload-artifact@main
        continue-on-error: true
        if: steps.organize.outputs.status == 'success' && env.UPLOAD_IPK_DIR == 'true' && steps.afb.outputs.status == 'success'
        with:
          name: ${{ env.date3 }}_${{matrix.target}}_packages_25.12-${{ env.Target_CFG_Machine }}${{ env.Kernel_Test }}${{ env.KERNEL66_NAME }}${{ env.BCM_FULLCONE_NAME }}${{ env.SFE }}${{ env.TRY_BBR_V3_NAME }}${{ env.OPENSSL_3_5_NAME }}${{ env.DOCKER_NAME }}${{ env.WAN_NAME }}${{ env.MAC80211_616_NAME }}${{ env.eBPF }}
          path: |
            ipks

      - name: 上传固件cowtransfer
        id: cowtransfer
        if: steps.organize.outputs.status == 'success' && env.UPLOAD_COWTRANSFER == 'true' && !cancelled()
        run: |
          curl -fsSL git.io/file-transfer | sh
          ./transfer cow --block 2621440 -s -p 64 --no-progress ${FIRMWARE} 2>&1 | tee cowtransfer.log
          echo "::warning file=cowtransfer.com::$(cat cowtransfer.log | grep https)"
          echo "url=$(cat cowtransfer.log | grep https | cut -f3 -d" ")" >> $GITHUB_OUTPUT

      - name: 上传固件WeTransfer
        id: wetransfer
        if: steps.organize.outputs.status == 'success' && env.UPLOAD_WETRANSFER == 'true' && !cancelled()
        run: |
          curl -fsSL git.io/file-transfer | sh
          ./transfer wet -s -p 16 --no-progress ${FIRMWARE} 2>&1 | tee wetransfer.log
          echo "::warning file=wetransfer.com::$(cat wetransfer.log | grep https)"
          echo "url=$(cat wetransfer.log | grep https | cut -f3 -d" ")" >> $GITHUB_OUTPUT

      - name: 生成发布标签
        id: tag
        if: steps.organize.outputs.status == 'success' && env.UPLOAD_RELEASE == '1' && !cancelled()
        run: |
          touch release.txt
          $GITHUB_WORKSPACE/gen-sha256sum.sh
          echo "# 当前固件IP地址："${{ github.event.inputs.SETIP }}" " >> release.txt
          [ ${{matrix.target}} = mt798x* ] && [ -e openwrt/target/linux/mediatek/filogic/base-files/lib/firmware/mediatek/nx30pro_eeprom.bin ] && echo "- eeprom 使用 H3C NX30 Pro 提取版本" >> release.txt
          [ "${{ env.Target_CFG_Machine }}" = rax3000m-emmc ] && echo "- 使用闪存频率: ($(grep -oP "max-frequency = <\K[0-9]*" openwrt/target/linux/mediatek/dts/mt7981b-cmcc-rax3000m-emmc-ubootmod.dts)) Hz" >> release.txt
          [ $UPLOAD_COWTRANSFER = true ] && echo "🔗 [Cowtransfer](${{ steps.cowtransfer.outputs.url }})" >> release.txt
          [ $UPLOAD_WETRANSFER = true ] && echo "🔗 [WeTransfer](${{ steps.wetransfer.outputs.url }})" >> release.txt
          echo "🔗 ${{ env.BCM_FULLCONE_NAME }}${{ env.SFE }}${{ env.TRY_BBR_V3_NAME }}${{ env.OPENSSL_3_5_NAME }}" >> release.txt
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 上传固件发布
        uses: softprops/action-gh-release@v2
        if: steps.tag.outputs.status == 'success' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: "${{ env.FIRMWARE }}/*"
          name: ${{ env.date }} ${{matrix.target}}-${{ env.Target_CFG_Machine }}-openwrt-2512
          tag_name: ${{ env.date }}_${{matrix.target}}-${{ env.Target_CFG_Machine }}-openwrt-2512
          body_path: release.txt

      - name: 删除工作流
        uses: Mattraks/delete-workflow-runs@main
        continue-on-error: true
        with:
          retain_days: 10
          keep_minimum_runs: 20

      - name: 删除旧版本
        uses: dev-drprasad/delete-older-releases@master
        if: env.UPLOAD_RELEASE == '1' && !cancelled()
        continue-on-error: true
        with:
          keep_latest: 99
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
